stages:
  - build
  - test
  - deploy

variables:
  DOCKER_IMAGE: $DOCKER_USERNAME/fastapi-blog-users:$CI_COMMIT_SHORT_SHA
  POSTGRES_DB: test_db
  POSTGRES_USER: test_user
  POSTGRES_PASSWORD: test_password
  DATABASE_URL: postgresql://test_user:test_password@postgres:5432/test_db

services:
  - docker:dind
  - postgres:17-alpine

build:
  stage: build
  image: docker:latest
  services:
    - docker:dind
  script:
    - echo "$DOCKER_PASSWORD" | docker login -u "$DOCKER_USERNAME" --password-stdin
    - docker build -t $DOCKER_IMAGE .
    - docker push $DOCKER_IMAGE
  only:
    - prod
    - dev
    - merge_requests
    - /^fix\/.*$/
    - /^feat\/.*$/

test:
  stage: test
  image: $DOCKER_IMAGE
  services:
    - postgres:17-alpine
  variables:
    POSTGRES_DB: test_db
    POSTGRES_USER: test_user
    POSTGRES_PASSWORD: test_password
    DATABASE_URL: postgresql://test_user:test_password@postgres:5432/test_db
  script:
    - pytest --maxfail=1 --disable-warnings -q
  only:
    - prod
    - dev
    - merge_requests
    - /^fix\/.*$/
    - /^feat\/.*$/

deploy:
  stage: deploy
  image: alpine:latest
  before_script:
    - apk add --no-cache openssh git
    - mkdir -p ~/.ssh
    - echo "$SSH_PRIVATE_KEY" > ~/.ssh/id_rsa
    - chmod 600 ~/.ssh/id_rsa
    - echo "StrictHostKeyChecking no" >> ~/.ssh/config
  script:
    - |
      ssh -o StrictHostKeyChecking=no "$SSH_USER@$SSH_HOST" \
        "bash -c '
          set -e
          cd ~/fastapi-app/fastapi-users
          git pull
          echo \"DOCKER_IMAGE=$DOCKER_IMAGE\" > .env
          echo \"DATABASE_URL=$DATABASE_URL\" >> .env
          echo \"USERS_SECRET_KEY=$USERS_SECRET_KEY\" >> .env
          echo \"JWT_LIFETIME_SECONDS=$JWT_LIFETIME_SECONDS\" >> .env
          echo \"COOKIE_NAME=$COOKIE_NAME\" >> .env
          echo \"COOKIE_MAX_AGE=$COOKIE_MAX_AGE\" >> .env
          echo \"COOKIE_SECURE=$COOKIE_SECURE\" >> .env
          echo \"COOKIE_HTTPONLY=$COOKIE_HTTPONLY\" >> .env
          echo \"COOKIE_SAMESITE=$COOKIE_SAMESITE\" >> .env
          echo \"CORS_ORIGINS=$DATABASE_URL\" >> .env
          echo \"CORS_ALLOW_CREDENTIALS=$CORS_ALLOW_CREDENTIALS\" >> .env
          echo \"CORS_ALLOW_METHODS=$CORS_ALLOW_METHODS\" >> .env
          echo \"CORS_ALLOW_HEADERS=$CORS_ALLOW_HEADERS\" >> .env
          docker-compose -f docker-compose.prod.yml pull
          docker-compose -f docker-compose.prod.yml down
          docker-compose -f docker-compose.prod.yml up -d
        '"

  only:
    - dev
    - prod

